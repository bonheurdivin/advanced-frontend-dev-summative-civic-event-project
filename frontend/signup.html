<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script><script src="js/theme.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script><title>Create account – CivicEvents+</title></head>
<body class="min-h-screen bg-slate-50 font-sans text-ink">
<a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:m-2 focus:rounded focus:bg-white focus:p-2">Skip to main content</a>
<main id="main" class="mx-auto flex min-h-screen max-w-md flex-col justify-center px-4 py-10">
  <p class="mb-6 text-2xl font-bold">CivicEvents<span class="text-civic">+</span></p>
  <h1 class="text-3xl font-bold">Create your account</h1>
  <div id="form-error" role="alert" tabindex="-1" class="mt-4 hidden rounded-lg border border-red-700 bg-red-50 p-3 text-red-900"></div>
  <form id="signup-form" class="mt-6 space-y-4" novalidate>
    <div><label for="full_name" class="font-bold">Full name</label>
      <input id="full_name" type="text" autocomplete="name" aria-describedby="full_name-error" class="mt-1 block w-full rounded-lg border border-slate-500 bg-white px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-civic aria-[invalid=true]:border-red-700">
      <p id="full_name-error" class="mt-1 hidden text-sm text-red-800"></p></div>
    <div><label for="email" class="font-bold">Email</label>
      <input id="email" type="email" autocomplete="email" aria-describedby="email-error" class="mt-1 block w-full rounded-lg border border-slate-500 bg-white px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-civic aria-[invalid=true]:border-red-700">
      <p id="email-error" class="mt-1 hidden text-sm text-red-800"></p></div>
    <div><label for="password" class="font-bold">Password</label>
      <input id="password" type="password" autocomplete="new-password" aria-describedby="password-error strength-label" class="mt-1 block w-full rounded-lg border border-slate-500 bg-white px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-civic aria-[invalid=true]:border-red-700">
      <div class="mt-2 h-2 w-full overflow-hidden rounded bg-slate-200" aria-hidden="true"><div id="strength-bar" class="h-full w-0 bg-red-700 transition-all"></div></div>
      <p id="strength-label" class="mt-1 text-sm text-slate-700" aria-live="polite">Use 8+ characters with upper and lower case, a number and a symbol.</p>
      <ul id="rules" class="mt-1 grid grid-cols-2 gap-x-3 text-sm text-slate-700">
        <li data-rule="len">8+ characters</li><li data-rule="lower">Lowercase letter</li><li data-rule="upper">Uppercase letter</li>
        <li data-rule="num">A number</li><li data-rule="special">A special character</li></ul>
      <p id="password-error" class="mt-1 hidden text-sm text-red-800"></p></div>
    <div><label for="confirm_password" class="font-bold">Confirm password</label>
      <input id="confirm_password" type="password" autocomplete="new-password" aria-describedby="confirm_password-error" class="mt-1 block w-full rounded-lg border border-slate-500 bg-white px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-civic aria-[invalid=true]:border-red-700">
      <p id="confirm_password-error" class="mt-1 hidden text-sm text-red-800"></p></div>
    <button id="submit" type="submit" class="w-full rounded-lg bg-civic px-4 py-3 font-bold text-white hover:bg-civic-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-civic disabled:opacity-60">Create account</button>
  </form>
  <p class="mt-6">Already registered? <a href="login.html" class="font-bold text-civic underline">Sign in</a></p>
</main>
<script src="js/config.js"></script><script src="js/auth.js"></script><script src="js/ui.js"></script><script src="js/api.js"></script><script src="js/guards.js"></script>
<script>
$(function () {
  Guards.guestOnly();
  const rules = p => ({ len: p.length >= 8, lower: /[a-z]/.test(p), upper: /[A-Z]/.test(p), num: /\d/.test(p), special: /[^A-Za-z0-9]/.test(p) });
  const levels = [['Very weak', 'bg-red-700'], ['Weak', 'bg-red-700'], ['Fair', 'bg-amber-600'], ['Good', 'bg-lime-700'], ['Strong', 'bg-green-700'], ['Strong', 'bg-green-700']];

  // Live strength meter + checklist (ticks tell people exactly what is missing).
  $('#password').on('input', function () {
    const r = rules(this.value), score = Object.values(r).filter(Boolean).length, lv = levels[this.value ? score : 0];
    $('#strength-bar').attr('class', 'h-full transition-all ' + lv[1]).css('width', (score * 20) + '%');
    $('#strength-label').text(this.value ? 'Password strength: ' + lv[0] : 'Use 8+ characters with upper and lower case, a number and a symbol.');
    $('#rules li').each(function () { const ok = r[$(this).data('rule')]; $(this).toggleClass('text-green-800 font-bold', ok).text((ok ? '✓ ' : '') + $(this).text().replace('✓ ', '')); });
  });

  $('#signup-form').on('submit', function (e) {
    e.preventDefault();
    const v = { full_name: $('#full_name').val().trim(), email: $('#email').val().trim(), password: $('#password').val(), confirm: $('#confirm_password').val() };
    $('#form-error').addClass('hidden');
    const checks = [
      UI.fieldError('full_name', v.full_name.length >= 2 ? '' : 'Enter your full name.'),
      UI.fieldError('email', /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email) ? '' : 'Enter a valid email address.'),
      UI.fieldError('password', Object.values(rules(v.password)).every(Boolean) ? '' : 'Password must meet all the rules listed above.'),
      UI.fieldError('confirm_password', v.confirm && v.confirm === v.password ? '' : 'Passwords do not match.')
    ];
    if (checks.includes(false)) return $('[aria-invalid="true"]').first().focus();

    const $btn = $('#submit'); UI.loading($btn, true, 'Creating account…');
    // Role is always "user": admins are created directly in the database, never through the public form.
    Api.request('POST', '/api/auth/signup', { auth: false, body: { full_name: v.full_name, email: v.email, password: v.password, role: 'user' } })
      .done(function () { UI.flash('Account created. Sign in to continue.', 'success'); location.href = 'login.html'; })
      .fail(function (err) {
        $('#form-error').text(err.status === 409 ? 'That email is already registered. Try signing in.' : err.message).removeClass('hidden').focus();
        UI.loading($btn, false);
      });
  });
});
</script></body></html>
