<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Announcements – CivicEvents+</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script><script src="js/theme.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script><link rel="stylesheet" href="css/site.css"></head>
<body class="bg-slate-50 font-sans text-ink">
<div id="app-header"></div>
<main id="main" class="mx-auto max-w-4xl px-4 py-8">
  <section class="hero"><p class="eyebrow">Listen up</p><h1>Announcements</h1><p class="lead">Audio updates from the city. Press play on any announcement to listen.</p>
    <button id="new-btn" data-role="admin" class="hero-btn hidden">+ New announcement</button></section>
  <p id="status" class="mt-4 text-slate-700" aria-live="polite"></p>
  <ul id="list" class="mt-4 space-y-4"><li class="h-24 animate-pulse rounded-xl bg-slate-200"></li><li class="h-24 animate-pulse rounded-xl bg-slate-200"></li></ul>
  <dialog id="dlg" aria-labelledby="dlg-h" class="w-[min(30rem,92vw)] rounded-2xl p-6 shadow-xl backdrop:bg-black/40"><h2 id="dlg-h" class="text-2xl font-bold">New announcement</h2>
    <form id="form" novalidate>
      <label for="f-title">Title</label><input id="f-title" type="text" aria-describedby="f-title-error"><p id="f-title-error" class="mt-1 hidden text-sm text-red-800"></p>
      <label for="f-audio">Audio file</label><input id="f-audio" type="file" accept="audio/*" class="mt-1 block w-full" aria-describedby="f-audio-help f-audio-error"><p id="f-audio-help" class="mt-1 text-sm text-slate-700">MP3, WAV, OGG or M4A, up to 5 MB.</p><p id="f-audio-error" class="mt-1 hidden text-sm text-red-800"></p>
      <label class="flex items-center gap-2"><input id="f-pub" type="checkbox" checked class="h-4 w-4 accent-civic"> Publish immediately</label>
      <div id="prog-wrap" class="mt-3 hidden"><div class="h-3 rounded bg-slate-200" role="progressbar" aria-label="Upload progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="prog" class="h-3 w-0 rounded bg-civic"></div></div></div>
      <div class="mt-5 flex gap-3"><button id="save" type="submit" class="rounded-lg bg-civic px-5 py-2.5 font-bold text-white disabled:opacity-60">Upload</button><button id="cancel" type="button" class="rounded-lg border border-slate-500 px-5 py-2.5 font-bold">Cancel</button></div>
    </form></dialog>
</main>
<div id="app-footer"></div>
<script src="js/config.js"></script><script src="js/auth.js"></script><script src="js/ui.js"></script><script src="js/api.js"></script><script src="js/guards.js"></script><script src="js/layout.js"></script><script src="js/media.js"></script>
<script>
$(function () {
  if (!Layout.init()) return;                       // GUARD: signed-in users. Create/publish/delete controls are data-role="admin" only.
  const admin = Auth.isAdmin(), dlg = $('#dlg')[0]; let items = [];
  const dur = x => { const a = new Audio(); a.preload = 'metadata'; a.onloadedmetadata = () => $('[data-dur="' + x.id + '"]').text(Media.time(a.duration)); a.src = UI.mediaUrl(x.audio_url); };
  function render() {
    const l = items.filter(x => admin || x.published);                                  // users only ever see published items
    $('#status').text(l.length + (l.length === 1 ? ' announcement' : ' announcements'));
    $('#list').html(l.length ? l.map(x => `<li class="flex flex-wrap items-center gap-4 rounded-xl bg-white p-4">
      <a href="announcement-detail.html?id=${x.id}" class="grid h-14 w-14 shrink-0 place-items-center rounded-full bg-civic text-2xl text-white" aria-label="Play ${UI.esc(x.title)}">▶</a>
      <div class="min-w-0 flex-1"><h2 class="truncate text-xl font-bold">${UI.esc(x.title)}</h2><p class="text-slate-700">${UI.fmt(x.created_at)}, length <span data-dur="${x.id}">…</span></p>
        ${x.published ? '' : '<p class="mt-1 w-fit rounded bg-amber-100 px-2 text-sm font-bold text-amber-900">Draft (not published)</p>'}</div>
      <div data-role="admin" class="hidden flex gap-2"><button class="pub rounded-lg border border-slate-500 px-3 py-2 font-bold" data-id="${x.id}">${x.published ? 'Unpublish' : 'Publish'}</button>
        <button class="del rounded-lg border border-red-700 px-3 py-2 font-bold text-red-800" data-id="${x.id}">Delete</button></div></li>`).join('')
      : '<li class="rounded-xl bg-white p-8 text-center">No announcements yet. Check back soon.</li>');
    l.forEach(dur); Guards.applyRoleUI();
  }
  function load() {
    Api.request('GET', '/api/announcements').done(r => { items = r.data || []; render(); })
      .fail(e => $('#list').html('<li class="rounded-xl border border-red-700 bg-red-50 p-6" role="alert">' + UI.esc(e.message) + ' <button id="retry" class="font-bold underline">Try again</button></li>'));
  }
  const setPub = (id, want) => Api.request('PATCH', '/api/announcements/' + id + (want ? '/publish' : '/unpublish'));
  $(document).on('click', '#retry', load);
  $('#list').on('click', '.pub', function () {            // ADMIN-ONLY: publish / unpublish (optimistic, reverts on failure)
    const x = items.find(i => i.id === $(this).data('id')), prev = x.published; x.published = !prev; render();
    setPub(x.id, x.published).done(() => UI.toast(x.published ? 'Published.' : 'Unpublished.', 'success')).fail(e => { x.published = prev; render(); UI.toast(e.message, 'error'); });
  }).on('click', '.del', function () {                    // ADMIN-ONLY: delete
    const id = $(this).data('id'); if (!confirm('Delete this announcement? This cannot be undone.')) return;
    Api.request('DELETE', '/api/announcements/' + id).done(() => { items = items.filter(i => i.id !== id); render(); UI.toast('Announcement deleted.', 'success'); }).fail(e => UI.toast(e.message, 'error'));
  });
  $('#new-btn').on('click', () => { $('#form')[0].reset(); UI.fieldError('f-title', ''); UI.fieldError('f-audio', ''); $('#prog-wrap').addClass('hidden'); dlg.showModal(); });
  $('#cancel').on('click', () => dlg.close());
  $('#f-audio').on('change', function () { const e = this.files[0] ? Media.check(this.files[0], Media.AUDIO, 5) : ''; UI.fieldError('f-audio', e); if (e) this.value = ''; });
  $('#form').on('submit', function (e) {                  // ADMIN-ONLY: upload (multipart, file key "audio")
    e.preventDefault();
    const t = $('#f-title').val().trim(), f = $('#f-audio')[0].files[0], want = $('#f-pub').is(':checked');
    const ok = [UI.fieldError('f-title', t ? '' : 'Enter a title.'), UI.fieldError('f-audio', Media.check(f, Media.AUDIO, 5))];
    if (ok.includes(false)) return $('#dlg [aria-invalid="true"]').first().focus();
    const fd = new FormData(); fd.append('title', t); fd.append('audio', f);
    const $b = $('#save'); UI.loading($b, true, 'Uploading…'); $('#prog-wrap').removeClass('hidden');
    Api.request('POST', '/api/announcements', { formData: fd, onProgress: p => { $('#prog').css('width', p * 100 + '%'); $('[role=progressbar]').attr('aria-valuenow', Math.round(p * 100)); } })
      .then(r => { const d = r.data || {}; return d.id && !!d.published !== want ? setPub(d.id, want) : r; })      // honour the publish checkbox whatever the backend default is
      .done(() => { dlg.close(); UI.toast('Announcement created. A notification was sent.', 'success'); load(); })
      .fail(er => UI.toast(er.message, 'error')).always(() => UI.loading($b, false));
  });
  load();
});
</script></body></html>
