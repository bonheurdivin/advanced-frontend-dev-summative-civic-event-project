<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Promos – CivicEvents+</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script><script src="js/theme.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script><link rel="stylesheet" href="css/site.css"></head>
<body class="bg-slate-50 font-sans text-ink">
<div id="app-header"></div>
<main id="main" class="mx-auto max-w-6xl px-4 py-8">
  <section class="hero"><p class="eyebrow">Watch</p><h1>Promos</h1><p class="lead">Short videos about city events and services, with captions on every video.</p>
    <button id="new-btn" data-role="admin" class="hero-btn hidden">+ New promo</button></section>
  <p id="status" class="mt-4 text-slate-700" aria-live="polite"></p>
  <ul id="list" class="mt-4 grid gap-5 sm:grid-cols-2 lg:grid-cols-3"><li class="h-64 animate-pulse rounded-xl bg-slate-200"></li><li class="h-64 animate-pulse rounded-xl bg-slate-200"></li><li class="h-64 animate-pulse rounded-xl bg-slate-200"></li></ul>
  <dialog id="dlg" aria-labelledby="dlg-h" class="w-[min(32rem,92vw)] rounded-2xl p-6 shadow-xl backdrop:bg-black/40"><h2 id="dlg-h" class="text-2xl font-bold">New promo</h2>
    <form id="form" novalidate>
      <label for="f-title">Title</label><input id="f-title" type="text" aria-describedby="f-title-error"><p id="f-title-error" class="mt-1 hidden text-sm text-red-800"></p>
      <label for="f-desc">Description</label><textarea id="f-desc" rows="2" aria-describedby="f-desc-error"></textarea><p id="f-desc-error" class="mt-1 hidden text-sm text-red-800"></p>
      <label for="f-cap">Caption text</label><textarea id="f-cap" rows="3" aria-describedby="f-cap-help f-cap-error"></textarea><p id="f-cap-error" class="mt-1 hidden text-sm text-red-800"></p><p id="f-cap-help" class="mt-1 text-sm text-slate-700">Write what is said in the video. Each sentence becomes one caption.</p>
      <label for="f-video">Video file</label><input id="f-video" type="file" accept="video/*" class="mt-1 block w-full" aria-describedby="f-video-help f-video-error"><p id="f-video-help" class="mt-1 text-sm text-slate-700">MP4, WebM or OGG, up to 8 MB.</p><p id="f-video-error" class="mt-1 hidden text-sm text-red-800"></p>
      <label class="flex items-center gap-2"><input id="f-pub" type="checkbox" checked class="h-4 w-4 accent-civic"> Published</label>
      <div id="prog-wrap" class="mt-3 hidden"><div class="h-3 rounded bg-slate-200" role="progressbar" aria-label="Upload progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="prog" class="h-3 w-0 rounded bg-civic"></div></div></div>
      <div class="mt-5 flex gap-3"><button id="save" type="submit" class="rounded-lg bg-civic px-5 py-2.5 font-bold text-white disabled:opacity-60">Save</button><button id="cancel" type="button" class="rounded-lg border border-slate-500 px-5 py-2.5 font-bold">Cancel</button></div>
    </form></dialog>
</main>
<div id="app-footer"></div>
<script src="js/config.js"></script><script src="js/auth.js"></script><script src="js/ui.js"></script><script src="js/api.js"></script><script src="js/guards.js"></script><script src="js/layout.js"></script><script src="js/media.js"></script>
<script>
$(function () {
  if (!Layout.init()) return;                       // GUARD: signed-in users. Create/edit/publish/delete are data-role="admin" only.
  const admin = Auth.isAdmin(), dlg = $('#dlg')[0], CK = 'civic_cache_promos'; let items = [], editId = null;
  // Lazy-load thumbnails: only fetch a video's first frame when its card scrolls near the viewport.
  const io = new IntersectionObserver((es, o) => es.forEach(e => { if (e.isIntersecting) { const v = e.target; v.src = v.dataset.src + '#t=0.5'; v.preload = 'metadata'; o.unobserve(v); } }), { rootMargin: '200px' });
  function render() {
    const l = items.filter(x => admin || x.published);
    $('#status').text(l.length + (l.length === 1 ? ' promo' : ' promos'));
    $('#list').html(l.length ? l.map(x => `<li class="flex flex-col overflow-hidden rounded-xl bg-white">
      <a href="promo-detail.html?id=${x.id}" class="relative block aspect-video bg-ink" aria-label="Play ${UI.esc(x.title)}"><video data-src="${UI.esc(UI.mediaUrl(x.video_url))}" muted playsinline preload="none" tabindex="-1" aria-hidden="true" class="h-full w-full object-cover"></video>
        <span class="absolute inset-0 grid place-items-center"><span class="grid h-14 w-14 place-items-center rounded-full bg-black/60 text-2xl text-white" aria-hidden="true">▶</span></span></a>
      <div class="flex flex-1 flex-col p-4">${x.published ? '' : '<p class="mb-1 w-fit rounded bg-amber-100 px-2 text-sm font-bold text-amber-900">Draft (not published)</p>'}
        <h2 class="text-xl font-bold">${UI.esc(x.title)}</h2><p class="mt-1 flex-1 line-clamp-2 text-slate-700">${UI.esc(x.description)}</p>
        <div class="mt-3 flex flex-wrap gap-2"><a href="promo-detail.html?id=${x.id}" class="rounded-lg bg-civic px-3 py-2 font-bold text-white">Watch</a>
          <span data-role="admin" class="hidden flex flex-wrap gap-2"><button class="edit rounded-lg border border-slate-500 px-3 py-2 font-bold" data-id="${x.id}">Edit</button>
            <button class="pub rounded-lg border border-slate-500 px-3 py-2 font-bold" data-id="${x.id}">${x.published ? 'Unpublish' : 'Publish'}</button>
            <button class="del rounded-lg border border-red-700 px-3 py-2 font-bold text-red-800" data-id="${x.id}">Delete</button></span></div></div></li>`).join('')
      : '<li class="col-span-full rounded-xl bg-white p-8 text-center">No promos yet. Check back soon.</li>');
    $('video[data-src]').each(function () { io.observe(this); }); Guards.applyRoleUI();
  }
  function load() {                                  // show cached list instantly, then refresh (cache is cleared after any change)
    try { const c = JSON.parse(sessionStorage.getItem(CK)); if (c) { items = c; render(); } } catch (e) {}
    Api.request('GET', '/api/promos').done(r => { items = r.data || []; try { sessionStorage.setItem(CK, JSON.stringify(items)); } catch (e) {} render(); })
      .fail(e => items.length ? UI.toast(e.message, 'error') : $('#list').html('<li class="col-span-full rounded-xl border border-red-700 bg-red-50 p-6" role="alert">' + UI.esc(e.message) + ' <button id="retry" class="font-bold underline">Try again</button></li>'));
  }
  const bust = () => { sessionStorage.removeItem(CK); load(); };
  const setPub = (id, want) => Api.request('PATCH', '/api/promos/' + id + (want ? '/publish' : '/unpublish'));
  $(document).on('click', '#retry', load);
  $('#list').on('click', '.pub', function () {      // ADMIN-ONLY
    const x = items.find(i => i.id === $(this).data('id')), prev = x.published; x.published = !prev; render();
    setPub(x.id, x.published).done(() => { sessionStorage.removeItem(CK); UI.toast(x.published ? 'Published.' : 'Unpublished.', 'success'); }).fail(e => { x.published = prev; render(); UI.toast(e.message, 'error'); });
  }).on('click', '.del', function () {              // ADMIN-ONLY
    const id = $(this).data('id'); if (!confirm('Delete this promo? This cannot be undone.')) return;
    Api.request('DELETE', '/api/promos/' + id).done(() => { UI.toast('Promo deleted.', 'success'); bust(); }).fail(e => UI.toast(e.message, 'error'));
  }).on('click', '.edit', function () { open(items.find(i => i.id === $(this).data('id'))); });
  function open(p) {
    editId = p ? p.id : null; $('#form')[0].reset(); ['f-title', 'f-desc', 'f-cap', 'f-video'].forEach(i => UI.fieldError(i, '')); $('#prog-wrap').addClass('hidden');
    $('#dlg-h').text(p ? 'Edit promo' : 'New promo'); $('#f-video-help').text(p ? 'Leave empty to keep the current video. MP4, WebM or OGG, up to 8 MB.' : 'MP4, WebM or OGG, up to 8 MB.');
    if (p) { $('#f-title').val(p.title); $('#f-desc').val(p.description); $('#f-cap').val(p.caption_text); $('#f-pub').prop('checked', !!p.published); }
    dlg.showModal();
  }
  $('#new-btn').on('click', () => open(null)); $('#cancel').on('click', () => dlg.close());
  $('#f-video').on('change', function () { const e = this.files[0] ? Media.check(this.files[0], Media.VIDEO, 8) : ''; UI.fieldError('f-video', e); if (e) this.value = ''; });
  $('#form').on('submit', function (e) {            // ADMIN-ONLY: create (POST) or edit (PUT), multipart with file key "video"
    e.preventDefault();
    const t = $('#f-title').val().trim(), d = $('#f-desc').val().trim(), c = $('#f-cap').val().trim(), f = $('#f-video')[0].files[0], want = $('#f-pub').is(':checked');
    // The backend rejects empty description or caption text, so require them here too.
    const ok = [UI.fieldError('f-title', t ? '' : 'Enter a title.'), UI.fieldError('f-desc', d ? '' : 'Enter a description.'), UI.fieldError('f-cap', c ? '' : 'Enter the caption text.'), UI.fieldError('f-video', f || editId ? (f ? Media.check(f, Media.VIDEO, 8) : '') : 'Choose a video file.')];
    if (ok.includes(false)) return $('#dlg [aria-invalid="true"]').first().focus();
    const fd = new FormData(); fd.append('title', t); fd.append('description', d); fd.append('caption_text', c); if (f) fd.append('video', f);
    const $b = $('#save'); UI.loading($b, true, 'Saving…'); if (f) $('#prog-wrap').removeClass('hidden');
    Api.request(editId ? 'PUT' : 'POST', editId ? '/api/promos/' + editId : '/api/promos', { formData: fd, onProgress: p => { $('#prog').css('width', p * 100 + '%'); $('[role=progressbar]').attr('aria-valuenow', Math.round(p * 100)); } })
      .then(r => { const d = r.data || {}, id = d.id || editId; return id && (editId ? !!(items.find(i => i.id === id) || {}).published : !!d.published) !== want ? setPub(id, want) : r; })
      .done(() => { dlg.close(); UI.toast(editId ? 'Promo updated.' : 'Promo created.', 'success'); bust(); })
      .fail(er => UI.toast(er.message, 'error')).always(() => UI.loading($b, false));
  });
  load();
});
</script></body></html>
